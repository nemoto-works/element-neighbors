<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お隣誰だ？ — 周期表クイズ</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1220;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}.app{width:min(100%,760px)}h1{font-size:1.6rem;margin:0 0 8px}p{color:#a7b8d2;line-height:1.55}.panel{border:1px solid #33455d;border-radius:22px;padding:clamp(14px,4vw,22px);background:#131f31}.stats{display:flex;justify-content:space-between;margin-bottom:16px;color:#a7b8d2}.question{font-size:1.1rem;font-weight:700;margin-bottom:12px}.table-scroll{overflow-x:auto;padding:4px 0 10px;scrollbar-color:#54749c transparent}.periodic-table{display:grid;grid-template-columns:repeat(18,minmax(30px,1fr));grid-template-rows:repeat(7,46px);gap:3px;min-width:660px}.cell{border:1px solid #425874;border-radius:5px;background:#101a2a;display:grid;place-items:center;text-align:center;line-height:1.05;color:transparent;user-select:none}.cell.empty{border-color:#28384d;background:#0d1725}.cell.question-cell{color:#fff;background:#254c72;border-color:#7eb9ef;box-shadow:0 0 0 2px #7eb9ef}.cell.answer-cell{color:#fff;background:#1a624e;border-color:#62d2aa;box-shadow:0 0 0 2px #62d2aa}.cell .symbol{font-size:1rem;font-weight:800}.cell .name{font-size:.48rem;margin-top:2px}.legend{font-size:.78rem;color:#a7b8d2;margin:2px 0 14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{font:inherit;border:1px solid #54749c;border-radius:14px;background:#1c3553;color:#fff;padding:14px 8px;min-height:58px;cursor:pointer}button:disabled{opacity:.65}button:focus-visible{outline:3px solid #ffd86b}button.correct{background:#1a624e}button.wrong{background:#853b46}.feedback{min-height:50px;margin:15px 0 5px;font-weight:700}.next{width:100%;background:#326cd0}small{color:#9db0ca}@media(max-width:520px){body{padding:10px}.panel{border-radius:16px}.periodic-table{min-width:594px;grid-template-columns:repeat(18,30px);grid-template-rows:repeat(7,40px)}.options{grid-template-columns:1fr}.cell .name{display:none}}
</style></head><body><main class="app"><h1>🧪 お隣誰だ？</h1><p>色のついた元素の、周期表で真横にいる元素を当てよう！</p><section class="panel"><div class="stats"><span id="count">問題 1</span><span id="score">正解 0</span></div><div id="question" class="question">この元素の右隣は？</div><div class="table-scroll" aria-label="横にスクロールできる周期表"><div id="periodic-table" class="periodic-table" role="grid" aria-label="18族7周期の周期表"></div></div><div class="legend">青＝問題の元素　緑＝回答後に表示される正解</div><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" hidden>次の問題 →</button></section><p><small>18族×7周期の主周期表を表示しています。分離表示されるランタノイド・アクチノイドは出題対象外です。空白をまたぐ元素は「隣」として出題しません。</small></p></main>
<script>
'use strict';
const elements=[
['H','水素',1,1],['He','ヘリウム',1,18],
['Li','リチウム',2,1],['Be','ベリリウム',2,2],['B','ホウ素',2,13],['C','炭素',2,14],['N','窒素',2,15],['O','酸素',2,16],['F','フッ素',2,17],['Ne','ネオン',2,18],
['Na','ナトリウム',3,1],['Mg','マグネシウム',3,2],['Al','アルミニウム',3,13],['Si','ケイ素',3,14],['P','リン',3,15],['S','硫黄',3,16],['Cl','塩素',3,17],['Ar','アルゴン',3,18],
['K','カリウム',4,1],['Ca','カルシウム',4,2],['Sc','スカンジウム',4,3],['Ti','チタン',4,4],['V','バナジウム',4,5],['Cr','クロム',4,6],['Mn','マンガン',4,7],['Fe','鉄',4,8],['Co','コバルト',4,9],['Ni','ニッケル',4,10],['Cu','銅',4,11],['Zn','亜鉛',4,12],['Ga','ガリウム',4,13],['Ge','ゲルマニウム',4,14],['As','ヒ素',4,15],['Se','セレン',4,16],['Br','臭素',4,17],['Kr','クリプトン',4,18],
['Rb','ルビジウム',5,1],['Sr','ストロンチウム',5,2],['Y','イットリウム',5,3],['Zr','ジルコニウム',5,4],['Nb','ニオブ',5,5],['Mo','モリブデン',5,6],['Tc','テクネチウム',5,7],['Ru','ルテニウム',5,8],['Rh','ロジウム',5,9],['Pd','パラジウム',5,10],['Ag','銀',5,11],['Cd','カドミウム',5,12],['In','インジウム',5,13],['Sn','スズ',5,14],['Sb','アンチモン',5,15],['Te','テルル',5,16],['I','ヨウ素',5,17],['Xe','キセノン',5,18],
['Cs','セシウム',6,1],['Ba','バリウム',6,2],['La','ランタン',6,3],['Hf','ハフニウム',6,4],['Ta','タンタル',6,5],['W','タングステン',6,6],['Re','レニウム',6,7],['Os','オスミウム',6,8],['Ir','イリジウム',6,9],['Pt','白金',6,10],['Au','金',6,11],['Hg','水銀',6,12],['Tl','タリウム',6,13],['Pb','鉛',6,14],['Bi','ビスマス',6,15],['Po','ポロニウム',6,16],['At','アスタチン',6,17],['Rn','ラドン',6,18],
['Fr','フランシウム',7,1],['Ra','ラジウム',7,2],['Ac','アクチニウム',7,3],['Rf','ラザホージウム',7,4],['Db','ドブニウム',7,5],['Sg','シーボーギウム',7,6],['Bh','ボーリウム',7,7],['Hs','ハッシウム',7,8],['Mt','マイトネリウム',7,9],['Ds','ダームスタチウム',7,10],['Rg','レントゲニウム',7,11],['Cn','コペルニシウム',7,12],['Nh','ニホニウム',7,13],['Fl','フレロビウム',7,14],['Mc','モスコビウム',7,15],['Lv','リバモリウム',7,16],['Ts','テネシン',7,17],['Og','オガネソン',7,18]
].map(([s,n,p,g])=>({s,n,p,g}));
const byPosition=new Map(elements.map(e=>[e.p+'-'+e.g,e]));
const questions=elements.flatMap(e=>[-1,1].map(dir=>({element:e,dir,answer:byPosition.get(e.p+'-'+(e.g+dir))})).filter(q=>q.answer));
const $=id=>document.getElementById(id);let score=0,count=0,current=null,answered=false,lastKey='';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderTable(revealAnswer=false){const cells=[];for(let p=1;p<=7;p++){for(let g=1;g<=18;g++){const e=byPosition.get(p+'-'+g);const cell=document.createElement('div');cell.className='cell'+(e?'':' empty');cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',e?'空欄':'元素のない位置');if(e===current.element){cell.classList.add('question-cell');cell.innerHTML='<span><span class="symbol">'+e.s+'</span><span class="name">'+e.n+'</span></span>';cell.setAttribute('aria-label','問題: '+e.s+' '+e.n)}else if(revealAnswer&&e===current.answer){cell.classList.add('answer-cell');cell.innerHTML='<span><span class="symbol">'+e.s+'</span><span class="name">'+e.n+'</span></span>';cell.setAttribute('aria-label','正解: '+e.s+' '+e.n)}cells.push(cell)}}$('periodic-table').replaceChildren(...cells)}
function newQuestion(){answered=false;count++;let q,key;do{q=questions[Math.floor(Math.random()*questions.length)];key=q.element.s+q.dir}while(key===lastKey&&questions.length>1);lastKey=key;current=q;$('count').textContent='問題 '+count;$('score').textContent='正解 '+score;$('question').textContent=q.element.s+'（'+q.element.n+'）の'+(q.dir===1?'右':'左')+'隣は？';$('feedback').textContent='';$('next').hidden=true;renderTable();const others=shuffle(elements.filter(e=>e.s!==q.answer.s&&e.s!==q.element.s)).slice(0,3);const opts=shuffle([q.answer,...others]);$('options').replaceChildren(...opts.map(e=>{const b=document.createElement('button');b.textContent=e.s+' · '+e.n;b.addEventListener('click',()=>answer(e.s,b));return b}))}
function answer(s,clicked){if(answered)return;answered=true;const ok=s===current.answer.s;if(ok)score++;$('score').textContent='正解 '+score;$('feedback').textContent=ok?'正解！ '+current.answer.s+'（'+current.answer.n+'）🎉':'正解は '+current.answer.s+'（'+current.answer.n+'）';renderTable(true);for(const b of $('options').children){b.disabled=true;if(b.textContent.startsWith(current.answer.s+' ·'))b.classList.add('correct');else if(b===clicked)b.classList.add('wrong')}$('next').hidden=false;$('next').focus()}
$('next').addEventListener('click',newQuestion);newQuestion();
</script></body></html>
