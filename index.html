<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お隣誰だ？ — 周期表クイズ</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:light;background:#eef4fb;color:#10233e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#eef4fb}.app{width:min(100%,760px)}h1{font-size:1.6rem;margin:0 0 8px}p{color:#415875;line-height:1.55}.panel{border:2px solid #b5c6da;border-radius:22px;padding:clamp(14px,4vw,22px);background:#fff;box-shadow:0 12px 34px #17365b1a}.difficulty{border:0;padding:0;margin:0 0 18px}.difficulty legend{font-weight:800;margin-bottom:8px}.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{min-height:52px;background:#edf3fa;color:#17365b;border:2px solid #9fb3ca}.mode[aria-pressed=true]{background:#173f73;color:#fff;border-color:#173f73}.mode small{display:block;color:inherit;font-size:.7rem;margin-top:2px}.stats{display:flex;justify-content:space-between;margin-bottom:16px;color:#415875}.question{font-size:1.1rem;font-weight:800;margin-bottom:12px}.table-scroll{overflow-x:auto;padding:4px 0 10px;scrollbar-color:#557492 #dce7f3}.periodic-table{display:grid;grid-template-columns:repeat(18,minmax(30px,1fr));grid-template-rows:repeat(7,46px);gap:3px;min-width:660px}.cell{border:1px solid #91a5bc;border-radius:5px;background:#f5f8fc;display:grid;place-items:center;text-align:center;line-height:1.05;color:transparent;user-select:none}.cell.empty{border-color:#c3cfdd;background:#e2eaf3}.cell.question-cell{color:#071d38;background:#ffd84d;border-color:#9a7200;box-shadow:0 0 0 2px #9a7200}.cell.answer-cell{color:#fff;background:#087f5b;border-color:#004f39;box-shadow:0 0 0 2px #004f39}.cell .symbol{font-size:1rem;font-weight:900}.cell .name{font-size:.48rem;margin-top:2px}.legend{font-size:.78rem;color:#415875;margin:2px 0 14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{font:inherit;border:2px solid #315b86;border-radius:14px;background:#e7f0fa;color:#102f52;padding:14px 8px;min-height:58px;cursor:pointer;font-weight:700}button:disabled{opacity:.78}button:focus-visible{outline:4px solid #e0a800;outline-offset:2px}button.correct{background:#087f5b;color:#fff;border-color:#004f39}button.wrong{background:#b42336;color:#fff;border-color:#741522}.feedback{min-height:50px;margin:15px 0 5px;font-weight:800}.next{width:100%;background:#185fba;color:#fff;border-color:#0d4384}small{color:#526b87}@media(max-width:520px){body{padding:10px}.panel{border-radius:16px}.periodic-table{min-width:594px;grid-template-columns:repeat(18,30px);grid-template-rows:repeat(7,40px)}.options{grid-template-columns:1fr}.cell .name{display:none}}
.mode-buttons{grid-template-columns:repeat(3,1fr)}.memory-card{margin:8px 0 18px;text-align:center}.memory-card[hidden],.table-scroll[hidden],.legend[hidden]{display:none}.memory-sequence{display:flex;align-items:stretch;justify-content:center;gap:8px}.memory-tile{width:min(29vw,118px);min-height:126px;border:3px solid #879bb2;border-radius:16px;background:#f5f8fc;display:grid;place-items:center;padding:8px;color:#17365b}.memory-tile.current{border-color:#9a7200;background:#fff2a8;color:#071d38}.memory-tile.target{border-style:dashed;border-color:#185fba;background:#edf5ff}.memory-tile.revealed{border-style:solid;border-color:#004f39;background:#087f5b;color:#fff;animation:memory-pop .24s ease-out}.memory-tile.outside{visibility:hidden}.memory-number{display:block;font-size:.72rem;color:inherit;opacity:.78}.memory-symbol{display:block;font-size:2.6rem;font-weight:900;line-height:1}.memory-name{display:block;font-size:.8rem;font-weight:800;margin-top:6px}.memory-blank{display:block;font-size:2.4rem;font-weight:900}.memory-hint{display:block;font-size:.7rem;font-weight:800;margin-top:6px}.memory-progress{margin-top:10px;font-size:.85rem;color:#415875}.memory-reset{min-height:0;margin-top:10px;padding:8px 14px;border:1px solid #8b5360;border-radius:10px;background:#fff;color:#7d1d31;font-size:.78rem}.memory-reset:hover{background:#fff0f3}@keyframes memory-pop{from{transform:scale(.82)}to{transform:scale(1)}}
</style></head><body><main class="app"><h1>🧪 お隣誰だ？</h1><p>元素の並びを、見て・答えて・くり返そう！</p><section class="panel"><fieldset class="difficulty"><legend>モードを選ぶ</legend><div class="mode-buttons"><button id="mode-exam" class="mode" type="button" aria-pressed="true">入試基礎<small>第2〜4周期</small></button><button id="mode-all" class="mode" type="button" aria-pressed="false">全元素<small>主周期表すべて</small></button><button id="mode-memory" class="mode" type="button" aria-pressed="false">積み上げ<small>原子番号順</small></button></div></fieldset><div class="stats"><span id="count">問題 1</span><span id="score">正解 0</span></div><div id="question" class="question">この元素の右隣は？</div><div id="memory-card" class="memory-card" hidden><div id="memory-sequence" class="memory-sequence" aria-label="原子番号順の元素"></div><div id="memory-progress" class="memory-progress"></div><button id="memory-reset" class="memory-reset" type="button">積み上げを最初からやり直す</button></div><div id="table-scroll" class="table-scroll" aria-label="横にスクロールできる周期表"><div id="periodic-table" class="periodic-table" role="grid" aria-label="18族7周期の周期表"></div></div><div id="legend" class="legend">黄＝問題の元素　緑＝回答後に表示される正解</div><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" hidden>次の問題 →</button></section><p><small>「積み上げ」は水素から原子番号順に1つずつ解放します。空欄を答えると元素が順番どおりに並び、途中で過去の元素も復習します。</small></p></main>
<script>
'use strict';
const elements=[
['H','水素',1,1],['He','ヘリウム',1,18],
['Li','リチウム',2,1],['Be','ベリリウム',2,2],['B','ホウ素',2,13],['C','炭素',2,14],['N','窒素',2,15],['O','酸素',2,16],['F','フッ素',2,17],['Ne','ネオン',2,18],
['Na','ナトリウム',3,1],['Mg','マグネシウム',3,2],['Al','アルミニウム',3,13],['Si','ケイ素',3,14],['P','リン',3,15],['S','硫黄',3,16],['Cl','塩素',3,17],['Ar','アルゴン',3,18],
['K','カリウム',4,1],['Ca','カルシウム',4,2],['Sc','スカンジウム',4,3],['Ti','チタン',4,4],['V','バナジウム',4,5],['Cr','クロム',4,6],['Mn','マンガン',4,7],['Fe','鉄',4,8],['Co','コバルト',4,9],['Ni','ニッケル',4,10],['Cu','銅',4,11],['Zn','亜鉛',4,12],['Ga','ガリウム',4,13],['Ge','ゲルマニウム',4,14],['As','ヒ素',4,15],['Se','セレン',4,16],['Br','臭素',4,17],['Kr','クリプトン',4,18],
['Rb','ルビジウム',5,1],['Sr','ストロンチウム',5,2],['Y','イットリウム',5,3],['Zr','ジルコニウム',5,4],['Nb','ニオブ',5,5],['Mo','モリブデン',5,6],['Tc','テクネチウム',5,7],['Ru','ルテニウム',5,8],['Rh','ロジウム',5,9],['Pd','パラジウム',5,10],['Ag','銀',5,11],['Cd','カドミウム',5,12],['In','インジウム',5,13],['Sn','スズ',5,14],['Sb','アンチモン',5,15],['Te','テルル',5,16],['I','ヨウ素',5,17],['Xe','キセノン',5,18],
['Cs','セシウム',6,1],['Ba','バリウム',6,2],['La','ランタン',6,3],['Hf','ハフニウム',6,4],['Ta','タンタル',6,5],['W','タングステン',6,6],['Re','レニウム',6,7],['Os','オスミウム',6,8],['Ir','イリジウム',6,9],['Pt','白金',6,10],['Au','金',6,11],['Hg','水銀',6,12],['Tl','タリウム',6,13],['Pb','鉛',6,14],['Bi','ビスマス',6,15],['Po','ポロニウム',6,16],['At','アスタチン',6,17],['Rn','ラドン',6,18],
['Fr','フランシウム',7,1],['Ra','ラジウム',7,2],['Ac','アクチニウム',7,3],['Rf','ラザホージウム',7,4],['Db','ドブニウム',7,5],['Sg','シーボーギウム',7,6],['Bh','ボーリウム',7,7],['Hs','ハッシウム',7,8],['Mt','マイトネリウム',7,9],['Ds','ダームスタチウム',7,10],['Rg','レントゲニウム',7,11],['Cn','コペルニシウム',7,12],['Nh','ニホニウム',7,13],['Fl','フレロビウム',7,14],['Mc','モスコビウム',7,15],['Lv','リバモリウム',7,16],['Ts','テネシン',7,17],['Og','オガネソン',7,18]
].map(([s,n,p,g])=>({s,n,p,g}));
const byPosition=new Map(elements.map(e=>[e.p+'-'+e.g,e]));
const allQuestions=elements.flatMap(e=>[-1,1].map(dir=>({element:e,dir,answer:byPosition.get(e.p+'-'+(e.g+dir))})).filter(q=>q.answer));
const atomicElements=`H:水素,He:ヘリウム,Li:リチウム,Be:ベリリウム,B:ホウ素,C:炭素,N:窒素,O:酸素,F:フッ素,Ne:ネオン,Na:ナトリウム,Mg:マグネシウム,Al:アルミニウム,Si:ケイ素,P:リン,S:硫黄,Cl:塩素,Ar:アルゴン,K:カリウム,Ca:カルシウム,Sc:スカンジウム,Ti:チタン,V:バナジウム,Cr:クロム,Mn:マンガン,Fe:鉄,Co:コバルト,Ni:ニッケル,Cu:銅,Zn:亜鉛,Ga:ガリウム,Ge:ゲルマニウム,As:ヒ素,Se:セレン,Br:臭素,Kr:クリプトン,Rb:ルビジウム,Sr:ストロンチウム,Y:イットリウム,Zr:ジルコニウム,Nb:ニオブ,Mo:モリブデン,Tc:テクネチウム,Ru:ルテニウム,Rh:ロジウム,Pd:パラジウム,Ag:銀,Cd:カドミウム,In:インジウム,Sn:スズ,Sb:アンチモン,Te:テルル,I:ヨウ素,Xe:キセノン,Cs:セシウム,Ba:バリウム,La:ランタン,Ce:セリウム,Pr:プラセオジム,Nd:ネオジム,Pm:プロメチウム,Sm:サマリウム,Eu:ユウロピウム,Gd:ガドリニウム,Tb:テルビウム,Dy:ジスプロシウム,Ho:ホルミウム,Er:エルビウム,Tm:ツリウム,Yb:イッテルビウム,Lu:ルテチウム,Hf:ハフニウム,Ta:タンタル,W:タングステン,Re:レニウム,Os:オスミウム,Ir:イリジウム,Pt:白金,Au:金,Hg:水銀,Tl:タリウム,Pb:鉛,Bi:ビスマス,Po:ポロニウム,At:アスタチン,Rn:ラドン,Fr:フランシウム,Ra:ラジウム,Ac:アクチニウム,Th:トリウム,Pa:プロトアクチニウム,U:ウラン,Np:ネプツニウム,Pu:プルトニウム,Am:アメリシウム,Cm:キュリウム,Bk:バークリウム,Cf:カリホルニウム,Es:アインスタイニウム,Fm:フェルミウム,Md:メンデレビウム,No:ノーベリウム,Lr:ローレンシウム,Rf:ラザホージウム,Db:ドブニウム,Sg:シーボーギウム,Bh:ボーリウム,Hs:ハッシウム,Mt:マイトネリウム,Ds:ダームスタチウム,Rg:レントゲニウム,Cn:コペルニシウム,Nh:ニホニウム,Fl:フレロビウム,Mc:モスコビウム,Lv:リバモリウム,Ts:テネシン,Og:オガネソン`.split(',').map((v,i)=>{const [s,n]=v.split(':');return{s,n,z:i+1}});
const $=id=>document.getElementById(id);let difficulty='exam',score=0,count=0,current=null,answered=false,lastKey='',memoryFrontier=0,memoryMastered=new Set(),memoryDirection=1;
try{const saved=JSON.parse(localStorage.getItem('element-neighbors-memory')||'{}');memoryFrontier=Math.max(0,Math.min(117,Number(saved.frontier)||0));memoryMastered=new Set(Array.isArray(saved.mastered)?saved.mastered:[])}catch{}
function saveMemory(){localStorage.setItem('element-neighbors-memory',JSON.stringify({frontier:memoryFrontier,mastered:[...memoryMastered]}))}
function resetMemory(){if(!confirm('積み上げの進捗を消して、水素からやり直しますか？'))return;localStorage.removeItem('element-neighbors-memory');memoryFrontier=0;memoryMastered=new Set();memoryDirection=1;answered=false;$('next').hidden=true;memoryQuestion();$('feedback').textContent='積み上げの進捗を初期化しました。水素から再開します。'}
function activeQuestions(){return difficulty==='exam'?allQuestions.filter(q=>q.element.p>=2&&q.element.p<=4&&q.answer.p>=2&&q.answer.p<=4):allQuestions}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderTable(revealAnswer=false){const cells=[];for(let p=1;p<=7;p++){for(let g=1;g<=18;g++){const e=byPosition.get(p+'-'+g);const cell=document.createElement('div');cell.className='cell'+(e?'':' empty');cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',e?'空欄':'元素のない位置');if(e===current.element){cell.classList.add('question-cell');cell.innerHTML='<span><span class="symbol">'+e.s+'</span><span class="name">'+e.n+'</span></span>';cell.setAttribute('aria-label','問題: '+e.s+' '+e.n)}else if(revealAnswer&&e===current.answer){cell.classList.add('answer-cell');cell.innerHTML='<span><span class="symbol">'+e.s+'</span><span class="name">'+e.n+'</span></span>';cell.setAttribute('aria-label','正解: '+e.s+' '+e.n)}cells.push(cell)}}$('periodic-table').replaceChildren(...cells)}
function memoryTile(element,state){const tile=document.createElement('div');tile.className='memory-tile '+state;if(!element){tile.classList.add('outside');tile.setAttribute('aria-hidden','true');return tile}if(state==='target'||state==='blank'){tile.innerHTML='<span><span class="memory-blank">□</span>'+(state==='target'?'<span class="memory-hint">ここは誰？</span>':'')+'</span>';tile.setAttribute('aria-label',state==='target'?'答える元素の空欄':'もう一方の隣の空欄');return tile}tile.innerHTML='<span><span class="memory-number">'+element.z+'</span><span class="memory-symbol">'+element.s+'</span><span class="memory-name">'+element.n+'</span></span>';tile.setAttribute('aria-label',(state==='revealed'?'正解: ':'問題: ')+element.s+' '+element.n);return tile}
function renderMemorySequence(revealAnswer=false){const index=current.memoryIndex;const tiles=[];for(const offset of [-1,0,1]){const element=atomicElements[index+offset];const isCurrent=offset===0;const isTarget=offset===memoryDirection;tiles.push(memoryTile(element,isCurrent?'current':isTarget?(revealAnswer?'revealed':'target'):'blank'))}$('memory-sequence').replaceChildren(...tiles)}
function memoryQuestion(){const useReview=memoryFrontier>1&&Math.random()<.35;const index=useReview?Math.floor(Math.random()*memoryFrontier):memoryFrontier;const available=[index>0?-1:null,index<atomicElements.length-1?1:null].filter(v=>v!==null);let dir;if(index===memoryFrontier){const needed=available.filter(v=>!memoryMastered.has(v));dir=needed.length?needed[Math.floor(Math.random()*needed.length)]:available[Math.floor(Math.random()*available.length)]}else{dir=available[Math.floor(Math.random()*available.length)]}const element=atomicElements[index],correct=atomicElements[index+dir];memoryDirection=dir;current={element,answer:correct,memoryIndex:index};renderMemorySequence();$('memory-progress').textContent='解放 '+(memoryFrontier+1)+' / 118';$('question').textContent=element.n+'の原子番号で'+(dir===1?'次':'前')+'は？';const unlocked=atomicElements.slice(0,Math.min(memoryFrontier+2,atomicElements.length));const others=shuffle(unlocked.filter(e=>e.s!==correct.s&&e.s!==element.s)).slice(0,3);const opts=shuffle([correct,...others]);$('options').replaceChildren(...opts.map(e=>{const b=document.createElement('button');b.textContent=e.s+' · '+e.n;b.addEventListener('click',()=>answer(e.s,b));return b}))}
function newQuestion(){answered=false;count++;$('count').textContent='問題 '+count;$('score').textContent='正解 '+score;$('feedback').textContent='';$('next').hidden=true;if(difficulty==='memory'){memoryQuestion();return}const questions=activeQuestions();let q,key;do{q=questions[Math.floor(Math.random()*questions.length)];key=q.element.s+q.dir}while(key===lastKey&&questions.length>1);lastKey=key;current=q;$('question').textContent=q.element.s+'（'+q.element.n+'）の'+(q.dir===1?'右':'左')+'隣は？';renderTable();const pool=difficulty==='exam'?elements.filter(e=>e.p>=2&&e.p<=4):elements;const others=shuffle(pool.filter(e=>e.s!==q.answer.s&&e.s!==q.element.s)).slice(0,3);const opts=shuffle([q.answer,...others]);$('options').replaceChildren(...opts.map(e=>{const b=document.createElement('button');b.textContent=e.s+' · '+e.n;b.addEventListener('click',()=>answer(e.s,b));return b}))}
function setDifficulty(next){if(difficulty===next)return;difficulty=next;score=0;count=0;lastKey='';for(const mode of ['exam','all','memory'])$('mode-'+mode).setAttribute('aria-pressed',String(next===mode));const memory=next==='memory';$('memory-card').hidden=!memory;$('table-scroll').hidden=memory;$('legend').hidden=memory;newQuestion()}
function answer(s,clicked){if(answered)return;answered=true;const ok=s===current.answer.s;if(ok){score++;if(difficulty==='memory'&&current.memoryIndex===memoryFrontier){memoryMastered.add(memoryDirection);const required=memoryFrontier===0||memoryFrontier===atomicElements.length-1?1:2;if(memoryMastered.size>=required&&memoryFrontier<atomicElements.length-1){memoryFrontier++;memoryMastered=new Set();$('feedback').textContent='正解！ '+current.answer.n+'。次は '+atomicElements[memoryFrontier].n+' まで解放！ 🎉'}saveMemory()}}$('score').textContent='正解 '+score;if(!$('feedback').textContent)$('feedback').textContent=ok?'正解！ '+current.answer.s+'（'+current.answer.n+'）🎉':'正解は '+current.answer.s+'（'+current.answer.n+'）';if(difficulty==='memory')renderMemorySequence(true);else renderTable(true);for(const b of $('options').children){b.disabled=true;if(b.textContent.startsWith(current.answer.s+' ·'))b.classList.add('correct');else if(b===clicked)b.classList.add('wrong')}$('next').hidden=false;$('next').focus()}
$('mode-exam').addEventListener('click',()=>setDifficulty('exam'));$('mode-all').addEventListener('click',()=>setDifficulty('all'));$('mode-memory').addEventListener('click',()=>setDifficulty('memory'));$('memory-reset').addEventListener('click',resetMemory);$('next').addEventListener('click',newQuestion);newQuestion();
</script></body></html>
